<!doctype html>
<html lang="nb">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Loppely fargeprøver</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #2b0c07; color: #FDEBD5; font: 13px/1.3 system-ui, sans-serif; }
  nav { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: #561A12; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 5px 14px 5px 8px; cursor: pointer; background: #7a3a2c; color: #FDEBD5; display: inline-flex; align-items: center; gap: 7px; }
  button[aria-pressed="true"] { background: #FDEBD5; color: #561A12; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid #E0693A; outline-offset: 2px; }
  .dots { display: inline-flex; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(253,235,213,.5); margin-left: -3px; }
  .dots i:first-child { margin-left: 0; width: 14px; height: 14px; }
  main { flex: 1; min-height: 0; display: flex; }
  iframe { border: 0; background: #fff; width: 100%; height: 100%; }
</style>
<nav aria-label="Fargeversjoner">
  <button data-n="1" disabled><span class="dots"><i style="background:#FDEBD5"></i><i style="background:#E0693A"></i><i style="background:#561A12"></i></span>1 · Krem</button>
  <button data-n="2" disabled><span class="dots"><i style="background:#E0693A"></i><i style="background:#FDEBD5"></i><i style="background:#561A12"></i></span>2 · Oransje</button>
  <button data-n="3" disabled><span class="dots"><i style="background:#561A12"></i><i style="background:#E0693A"></i><i style="background:#FDEBD5"></i></span>3 · Maroon</button>
  <button data-n="4" disabled><span class="dots"><i style="background:#B67B9A"></i><i style="background:#E0693A"></i><i style="background:#FDEBD5"></i></span>4 · Mauve</button>
</nav>
<main><iframe id="view" title="Loppely"></iframe></main>
<script>
  const tabs = [...document.querySelectorAll('button[data-n]')];
  const frame = document.getElementById('view');
  const css = {};
  let html = null;
  let current = [1, 2, 3, 4].includes(+location.hash.slice(1)) ? +location.hash.slice(1) : 1;

  function scrollFraction() {
    try {
      const w = frame.contentWindow, de = w.document.documentElement;
      return w.scrollY / Math.max(1, de.scrollHeight - w.innerHeight);
    } catch (e) { return 0; }
  }
  function render() {
    if (!html || !css[current]) return;
    const f = scrollFraction();
    frame.onload = () => {
      const w = frame.contentWindow;
      w.scrollTo(0, f * (w.document.documentElement.scrollHeight - w.innerHeight));
    };
    frame.srcdoc = '<!doctype html><html lang="nb" data-theme="light"><base href="about:srcdoc"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      html + '<style id="fargeversjon">' + css[current] + '</style>';
  }
  function pick(n) {
    current = n;
    history.replaceState(null, '', '#' + n);
    tabs.forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === n));
    render();
  }
  tabs.forEach(b => b.onclick = () => pick(+b.dataset.n));
  addEventListener('keydown', e => {
    if (e.target !== document.body) return;
    if (e.key >= '1' && e.key <= '4' && !tabs[e.key - 1].disabled) pick(+e.key);
  });

  const get = f => fetch(f).then(r => r.ok ? r.text() : null).catch(() => null);
  Promise.all([get('lander.html'), ...[1, 2, 3, 4].map(n => get('farge-' + n + '.css'))]).then(([h, ...c]) => {
    html = h;
    c.forEach((t, i) => { if (t) css[i + 1] = t; tabs[i].disabled = !t; });
    pick(css[current] ? current : 1);
  });
</script>
</html>
