<!doctype html>
<html lang="nb">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Loppely fargeprøver</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #2b0c07; color: #FDEBD5; font: 13px/1.3 system-ui, sans-serif; }
  nav { flex: none; display: flex; align-items: center; gap: 5px; padding: 6px 8px; background: #561A12; flex-wrap: wrap; }
  button { flex: none; font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 4px 11px 4px 6px; cursor: pointer; background: #7a3a2c; color: #FDEBD5; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button[aria-pressed="true"] { background: #FDEBD5; color: #561A12; }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 2px solid #E0693A; outline-offset: 2px; }
  .dots { display: inline-flex; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(253,235,213,.5); margin-left: -3px; }
  .dots i:first-child { margin-left: 0; width: 14px; height: 14px; }
  .nr { opacity: .7; font-variant-numeric: tabular-nums; }
  main { flex: 1; min-height: 0; display: flex; }
  iframe { border: 0; background: #fff; width: 100%; height: 100%; }
  @media (max-width: 700px) {
    nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
  }
</style>
<nav aria-label="Fargeversjoner"></nav>
<main><iframe id="view" title="Loppely"></iframe></main>
<script>
  const VERSJONER = [
    { n: 1, navn: 'Krem', dots: ['#FDEBD5', '#E0693A', '#561A12'] },
    { n: 2, navn: 'Oransje', dots: ['#E0693A', '#FDEBD5', '#561A12'] },
    { n: 3, navn: 'Maroon', dots: ['#561A12', '#E0693A', '#FDEBD5'] },
    { n: 4, navn: 'Mauve', dots: ['#B67B9A', '#E0693A', '#FDEBD5'] },
    { n: 5, navn: 'Papir', dots: ['#FFFDF9', '#B67B9A', '#E0693A'] },
    { n: 6, navn: 'Krem og mauve', dots: ['#FDEBD5', '#B67B9A', '#561A12'] },
    { n: 7, navn: 'Natt', dots: ['#2E0D08', '#E0693A', '#B67B9A'] },
    { n: 8, navn: 'Oransje og mauve', dots: ['#E0693A', '#B67B9A', '#2E0D08'] },
    { n: 9, navn: 'Mauve og krem', dots: ['#B67B9A', '#FDEBD5', '#561A12'] },
    { n: 10, navn: 'Fersken', dots: ['#FBD0B0', '#561A12', '#B67B9A'] },
    { n: 11, navn: 'Brettet', dots: ['#FDEBD5', '#E0693A', '#B67B9A'] },
    { n: 12, navn: 'To-tone', dots: ['#FDEBD5', '#561A12', '#2E0D08'] }
  ];
  const nav = document.querySelector('nav');
  const frame = document.getElementById('view');
  const tabs = VERSJONER.map(v => {
    const b = document.createElement('button');
    b.type = 'button';
    b.disabled = true;
    b.dataset.n = v.n;
    const dots = document.createElement('span');
    dots.className = 'dots';
    v.dots.forEach(c => { const i = document.createElement('i'); i.style.background = c; dots.appendChild(i); });
    const nr = document.createElement('span');
    nr.className = 'nr';
    nr.textContent = v.n;
    b.append(dots, nr, ' ' + v.navn);
    b.onclick = () => pick(v.n);
    nav.appendChild(b);
    return b;
  });
  const css = {};
  let html = null;
  const fromHash = +location.hash.slice(1);
  let current = VERSJONER.some(v => v.n === fromHash) ? fromHash : 1;

  function scrollFraction() {
    try {
      const w = frame.contentWindow, de = w.document.documentElement;
      return w.scrollY / Math.max(1, de.scrollHeight - w.innerHeight);
    } catch (e) { return 0; }
  }
  function render() {
    if (!html || !css[current]) return;
    const f = scrollFraction();
    frame.onload = () => {
      const w = frame.contentWindow;
      w.scrollTo(0, f * (w.document.documentElement.scrollHeight - w.innerHeight));
    };
    frame.srcdoc = '<!doctype html><html lang="nb" data-theme="light"><base href="about:srcdoc"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      html + '<style id="fargeversjon">' + css[current] + '</style>';
  }
  function pick(n) {
    current = n;
    history.replaceState(null, '', '#' + n);
    tabs.forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === n));
    const active = tabs[n - 1];
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    render();
  }
  addEventListener('keydown', e => {
    if (e.target !== document.body) return;
    const i = VERSJONER.findIndex(v => String(v.n) === e.key);
    if (i >= 0 && !tabs[i].disabled) pick(VERSJONER[i].n);
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const ready = VERSJONER.filter((v, k) => !tabs[k].disabled).map(v => v.n);
      const at = ready.indexOf(current);
      if (at >= 0) pick(ready[(at + (e.key === 'ArrowRight' ? 1 : ready.length - 1)) % ready.length]);
    }
  });

  const get = f => fetch(f).then(r => r.ok ? r.text() : null).catch(() => null);
  Promise.all([get('lander.html'), ...VERSJONER.map(v => get('farge-' + v.n + '.css'))]).then(([h, ...c]) => {
    html = h;
    c.forEach((t, i) => { if (t) css[VERSJONER[i].n] = t; tabs[i].disabled = !t; });
    pick(css[current] ? current : 1);
  });
</script>
</html>
